[project]
name = "larrybot"
version = "2.0.0"
description = "Chess bot that models any player's style at any ELO level"
authors = ["Oren Livne <you@example.com>"]
dependencies = [
    "python-chess>=1.999",
    "berserk>=0.14.0",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
