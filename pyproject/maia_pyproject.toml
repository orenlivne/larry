[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maia-chess"
version = "1.0.0"
description = "Maia Chess: a human-like neural network for chess prediction and analysis."
authors = [
  { name = "CSSLab", email = "noreply@csslab.maia" }
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "tensorflow>=2.8",
  "numpy",
  "pandas",
  "python-chess",
  "tqdm",
  "zstandard",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
